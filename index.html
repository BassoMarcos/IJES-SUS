<style>
/* Layout: encabezado fijo con totales + filtros, lista de movimientos abajo; formulario en hoja deslizante */
:root{
  --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eef1ec; --ink:#1c2420; --ink-soft:#5f6b63;
  --line:#dde3dc; --accent:#2f7d4f; --accent-ink:#1c5234;
  --pos:#2f7d4f; --pos-bg:#e4f1e8; --neg:#c0392b; --neg-bg:#fbeae7; --int:#b7791f; --int-bg:#fbf1dd;
  --shadow:0 1px 3px rgba(20,40,30,.08),0 6px 20px rgba(20,40,30,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11160f; --surface:#1a211a; --surface-2:#222a21; --ink:#e7ede6; --ink-soft:#9aa89c;
  --line:#2c362b; --accent:#5fb57e; --accent-ink:#8fd3a6;
  --pos:#6cc489; --pos-bg:#17311f; --neg:#e07a6b; --neg-bg:#331a16; --int:#e0b25a; --int-bg:#332a14;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11160f; --surface:#1a211a; --surface-2:#222a21; --ink:#e7ede6; --ink-soft:#9aa89c;
  --line:#2c362b; --accent:#5fb57e; --accent-ink:#8fd3a6;
  --pos:#6cc489; --pos-bg:#17311f; --neg:#e07a6b; --neg-bg:#331a16; --int:#e0b25a; --int-bg:#332a14;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  margin:0;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:14px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand-id{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{height:44px;width:auto;flex:0 0 auto;display:block}
/* el logo es una silueta blanca: en tema claro lo invertimos a oscuro para que se vea */
:root:not([data-theme="dark"]) .brand-logo{filter:invert(1) brightness(.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand-logo{filter:none}}
:root[data-theme="dark"] .brand-logo{filter:none}
:root[data-theme="light"] .brand-logo{filter:invert(1) brightness(.3)}
.brand h1{font-size:1.15rem;letter-spacing:-.01em}
.brand .sub{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.theme-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);
  border-radius:8px;padding:5px 9px;font-size:.78rem;cursor:pointer}

/* Saldo grande + tiles */
.saldo{margin-top:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.saldo .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft)}
.saldo .val{font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.tile .t{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.tile .n{font-size:.98rem;font-weight:650;margin-top:2px}
.tile.pos .n{color:var(--pos)} .tile.int .n{color:var(--int)} .tile.neg .n{color:var(--neg)}

/* Toolbar */
.toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search],.toolbar select{
  background:var(--bg);border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:9px 11px;font-size:.9rem;font-family:inherit;min-width:0}
.toolbar input[type=search]{flex:1 1 150px}
.toolbar select{flex:0 0 auto}
.btn{border:none;border-radius:9px;padding:9px 14px;font-size:.9rem;font-weight:600;
  font-family:inherit;cursor:pointer;background:var(--accent);color:#fff;white-space:nowrap}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:active{transform:translateY(1px)}

/* Estado persistencia */
.saver{font-size:.72rem;color:var(--ink-soft);margin-top:8px;min-height:1em}
.saver.err{color:var(--neg)}

/* Lista */
.list{padding-block:14px 90px}
.mgroup{margin-top:18px}
.mgroup:first-child{margin-top:4px}
.mgroup .gh{display:flex;justify-content:space-between;align-items:baseline;
  padding:0 2px 7px;border-bottom:1px solid var(--line);margin-bottom:8px}
.mgroup .gh .gm{font-size:.82rem;font-weight:650;text-transform:capitalize;color:var(--ink)}
.mgroup .gh .gt{font-size:.8rem;font-weight:650}
.row{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:10px;cursor:pointer}
.row:hover{background:var(--surface-2)}
.av{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:.74rem;font-weight:700;color:#fff;letter-spacing:.02em}
.row .mid{flex:1 1 auto;min-width:0}
.row .nm{font-size:.92rem;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dt{font-size:.74rem;color:var(--ink-soft);margin-top:1px}
.row .amt{font-size:.95rem;font-weight:700;white-space:nowrap}
.amt.pos{color:var(--pos)} .amt.neg{color:var(--neg)} .amt.int{color:var(--int)}
.chip{display:inline-block;font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;
  padding:1px 6px;border-radius:5px;margin-left:7px;vertical-align:middle;font-weight:700}
.chip.int{background:var(--int-bg);color:var(--int)}
.chip.neg{background:var(--neg-bg);color:var(--neg)}
.empty{text-align:center;color:var(--ink-soft);padding:40px 10px;font-size:.9rem}

/* FAB */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));
  bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;
  width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:#fff;
  font-size:1.7rem;line-height:1;cursor:pointer;box-shadow:var(--shadow)}

/* Hoja / modal */
.backdrop{position:fixed;inset:0;background:rgba(10,20,14,.5);z-index:40;
  display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;
  border-radius:16px 16px 0 0;box-shadow:var(--shadow);
  padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));
  max-height:92vh;overflow:auto}
@media(min-width:560px){.backdrop{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font-size:1.05rem;margin-bottom:2px}
.sheet .hint{font-size:.78rem;color:var(--ink-soft);margin-bottom:14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-soft);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);
  color:var(--ink);border-radius:9px;padding:10px 11px;font-size:.95rem;font-family:inherit}
.seg{display:flex;gap:6px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px 4px;border:1px solid var(--line);
  border-radius:9px;font-size:.84rem;font-weight:600;cursor:pointer;color:var(--ink-soft)}
.seg input:checked+span{border-color:var(--accent);background:var(--pos-bg);color:var(--accent-ink)}
.sheet-actions{display:flex;gap:9px;margin-top:6px}
.sheet-actions .btn{flex:1;justify-content:center;text-align:center}
.danger{background:var(--neg-bg);color:var(--neg);border:1px solid transparent}
.row-del{margin-top:10px;width:100%;text-align:center}

/* Informe */
.rep-block{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:11px}
.rep-block .rl{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft)}
.rep-block .rv{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-top:8px}
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.rep-grid .rep-block{margin:0}
.rep-block.ingreso .rv{color:var(--pos)} .rep-block.gasto .rv{color:var(--neg)}
.rep-sub{font-size:.72rem;color:var(--ink-soft);margin-top:4px}
.rep-ab{margin-top:4px}
.rep-ab .rl{margin-bottom:8px}
.rep-ab ul{list-style:none;margin:0;padding:0}
.rep-ab li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.rep-ab li:last-child{border-bottom:none}
.rep-ab li .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-ab li .amt{font-weight:650;color:var(--pos);white-space:nowrap}
.rep-none{font-size:.88rem;color:var(--ink-soft);padding:6px 0}
</style>

<script>

  var AV_COLORS=["#6b8e9e","#9e6b8e","#8e9e6b","#9e8a6b","#6b9e86","#866b9e","#9e6b6b","#6b9e9e"];

  var syncTimer = null;

  // Arranca con lo guardado localmente (rápido); luego se reemplaza con lo de la nube.
  var state = [];
  try{ var ls=localStorage.getItem("caja_ijes"); if(ls) state=JSON.parse(ls)||[]; }catch(e){}
  if(!state.length){
    try{ state = JSON.parse(document.getElementById("caja-data").textContent) || []; }catch(e){ state=[]; }
  }

  var el = function(id){return document.getElementById(id);};
  var editingId = null;

  function money(n){ return "$"+FMT.format(n); }
  function money0(n){ var s=FMT0.format(Math.abs(n)); return (n<0?"-$":"$")+s; }
  function tipoOf(r){ return r.tipo || (r.monto<0?"salida":"aporte"); }
  function initials(name){
    var p=name.replace(/[,]/g,"").trim().split(/\s+/).filter(Boolean);
    if(!p.length) return "?";
    if(p.length===1) return p[0].slice(0,2).toUpperCase();
    return (p[0][0]+p[p.length-1][0]).toUpperCase();
  }
  function colorFor(name){
    var h=0; for(var i=0;i<name.length;i++){h=(h*31+name.charCodeAt(i))>>>0;}
    return AV_COLORS[h%AV_COLORS.length];
  }
  function fmtDate(iso){
    var d=new Date(iso); if(isNaN(d)) return iso;
    var dd=("0"+d.getDate()).slice(-2), mm=("0"+(d.getMonth()+1)).slice(-2);
    var hh=("0"+d.getHours()).slice(-2), mi=("0"+d.getMinutes()).slice(-2);
    return dd+"/"+mm+"/"+d.getFullYear()+" "+hh+":"+mi;
  }
  function monthKey(iso){ var d=new Date(iso); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2); }
  function monthLabel(iso){ var d=new Date(iso); return MESES[d.getMonth()]+" "+d.getFullYear(); }

  // ---- totales ----
  function totals(rows){
    var t={aporte:0,interes:0,salida:0,saldo:0};
    rows.forEach(function(r){ var k=tipoOf(r); t[k]=(t[k]||0)+r.monto; t.saldo+=r.monto; });
    return t;
  }

  // ---- render ----
  function render(){
    var q=(el("q").value||"").toLowerCase().trim();
    var ft=el("fTipo").value;

    var all = state.slice().sort(function(a,b){ return a.fecha<b.fecha?1:(a.fecha>b.fecha?-1:0); });
    var filtered = all.filter(function(r){
      if(ft && tipoOf(r)!==ft) return false;
      if(q && (r.detalle||"").toLowerCase().indexOf(q)<0) return false;
      return true;
    });

    // totales (sobre TODO, no sobre el filtro)
    var t=totals(state);
    el("saldoVal").textContent = money(t.saldo);
    el("tAportes").textContent = money0(t.aporte);
    el("tInt").textContent = money(t.interes);
    el("tSal").textContent = money0(t.salida);

    var list=el("list"); list.innerHTML="";
    if(!filtered.length){
      list.innerHTML='<div class="empty">No hay movimientos que coincidan.</div>';
      return;
    }
    var curKey=null, groupEl=null;
    filtered.forEach(function(r){
      var k=monthKey(r.fecha);
      if(k!==curKey){
        curKey=k;
        groupEl=document.createElement("div"); groupEl.className="mgroup";
        var sub=all.filter(function(x){return monthKey(x.fecha)===k;});
        var gt=sub.reduce(function(s,x){return s+x.monto;},0);
        var gh=document.createElement("div"); gh.className="gh";

        groupEl.appendChild(gh);
        list.appendChild(groupEl);

      var tp=tipoOf(r);
      var row=document.createElement("div"); row.className="row"; row.dataset.id=r.id;
      var isInt = tp==="interes";
      var av = isInt
        ? '<div class="av" style="background:var(--int)">%</div>'
        : '<div class="av" style="background:'+colorFor(r.detalle)+'">'+initials(r.detalle)+'</div>';
      var chip = isInt?'<span class="chip int">interés</span>':(tp==="salida"?'<span class="chip neg">salida</span>':'');
      var amtCls = isInt?"int":(r.monto<0?"neg":"pos");
      var sign = r.monto<0?"":"+";
      row.innerHTML = av+
        '<div class="mid"><div class="nm">'+escapeHtml(r.detalle)+chip+'</div>'+
        '<div class="dt tnum">'+fmtDate(r.fecha)+'</div></div>'+
        '<div class="amt tnum '+amtCls+'">'+sign+money(r.monto)+'</div>';
      row.addEventListener("click",function(){ openForm(r.id); });
      groupEl.appendChild(row);
    });
  }
  function escapeHtml(s){ return (s||"").replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // ---- persistencia: local (instantánea) + nube (JSONBin) ----
  function saveLocal(){ try{ localStorage.setItem("caja_ijes", JSON.stringify(state)); }catch(e){} }

  function persist(){
    saveLocal();
    // guarda en la nube con un pequeño retardo para agrupar cambios seguidos
    setSaver("Guardando…", false);
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(cloudSave, 700);
  }

  function cloudSave(){
    fetch(BIN_URL, {
      method: "PUT",
      headers: { "Content-Type":"application/json", "X-Master-Key": BIN_KEY },
      body: JSON.stringify({ movimientos: state })
    }).then(function(r){
      if(!r.ok) throw new Error("http "+r.status);
      setSaver("Guardado y sincronizado ✓", false);
    }).catch(function(){
      setSaver("Guardado en este dispositivo · sin conexión, se sincroniza al reconectar", true);
    });
  }

  function cloudLoad(cb){
    setSaver("Cargando…", false);
    fetch(BIN_URL + "/latest", {
      headers: { "X-Master-Key": BIN_KEY }
    }).then(function(r){
      if(!r.ok) throw new Error("http "+r.status);
      return r.json();
    }).then(function(j){
      var rec = (j && j.record) ? j.record : j;
      var arr = rec && rec.movimientos ? rec.movimientos : (Array.isArray(rec)?rec:null);
      if(Array.isArray(arr)){
        // si la nube está vacía pero tenemos datos locales, subimos los locales (primer uso)
        if(arr.length===0 && state.length>0){ cloudReady=true; cloudSave(); }
        else { state = arr; saveLocal(); }
      }
      cloudReady = true;
      setSaver("Sincronizado ✓", false);
      if(cb) cb();
    }).catch(function(){
      cloudReady = true; // seguimos con lo local
      setSaver("Sin conexión · mostrando datos de este dispositivo", true);
      if(cb) cb();
    });
  }

  function setSaver(msg,isErr){ var s=el("saver"); s.textContent=msg; s.className="saver"+(isErr?" err":""); }

  // ---- formulario ----
  function openForm(id){
    editingId = id||null;
    var r = id ? state.filter(function(x){return x.id===id;})[0] : null;
    var now=new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
    var nowLocal=now.toISOString().slice(0,16);
    var tp = r?tipoOf(r):"aporte";
    var monto = r?Math.abs(r.monto):"";
    var bd=document.createElement("div"); bd.className="backdrop"; bd.id="backdrop";
    bd.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true">'+
        '<h2>'+(r?"Editar movimiento":"Nuevo movimiento")+'</h2>'+
        '<div class="hint">'+(r?"Modificá los datos o eliminá el movimiento.":"Cargá un aporte, un interés o una salida.")+'</div>'+
        '<div class="field"><label>Tipo</label><div class="seg">'+
          seg("tipo","aporte","Aporte",tp)+seg("tipo","interes","Interés",tp)+seg("tipo","salida","Salida",tp)+
        '</div></div>'+
        '<div class="field"><label>Persona / Detalle</label>'+
          '<input id="fDetalle" type="text" placeholder="Ej: Marcos Joel Basso" value="'+(r?escapeHtml(r.detalle).replace(/"/g,"&quot;"):"")+'"></div>'+
        '<div class="field"><label>Monto (en pesos, sin signo)</label>'+
          '<input id="fMonto" type="number" inputmode="decimal" step="0.01" min="0" placeholder="5000" value="'+monto+'"></div>'+
        '<div class="field"><label>Fecha y hora</label>'+
          '<input id="fFecha" type="datetime-local" value="'+(r?r.fecha:nowLocal)+'"></div>'+
        '<div class="sheet-actions">'+
          '<button class="btn ghost" id="cancelBtn" type="button">Cancelar</button>'+
          '<button class="btn" id="saveBtn" type="button">'+(r?"Guardar":"Agregar")+'</button>'+
        '</div>'+
        (r?'<button class="btn danger row-del" id="delBtn" type="button">Eliminar movimiento</button>':'')+
      '</div>';
    document.body.appendChild(bd);
    bd.addEventListener("click",function(e){ if(e.target===bd) closeForm(); });
    el("cancelBtn").addEventListener("click",closeForm);
    el("saveBtn").addEventListener("click",submitForm);
    if(el("delBtn")) el("delBtn").addEventListener("click",function(){ delMov(id); });
    var di=el("fDetalle"); if(di && !r) di.focus();
  }
  function seg(name,val,label,cur){
    return '<label><input type="radio" name="'+name+'" value="'+val+'"'+(cur===val?" checked":"")+
           '><span>'+label+'</span></label>';
  }
  function closeForm(){ var bd=el("backdrop"); if(bd) bd.remove(); editingId=null; }

  function submitForm(){
    var detalle=(el("fDetalle").value||"").trim();
    var montoRaw=el("fMonto").value;
    var fecha=el("fFecha").value;
    var tp=(document.querySelector('input[name="tipo"]:checked')||{}).value||"aporte";
    if(!detalle){ el("fDetalle").focus(); return; }
    var monto=parseFloat(montoRaw);
    if(isNaN(monto)||monto<=0){ el("fMonto").focus(); return; }
    if(!fecha){ el("fFecha").focus(); return; }
    var signed = tp==="salida" ? -Math.abs(monto) : Math.abs(monto);
    if(editingId){
      state.forEach(function(r){ if(r.id===editingId){ r.detalle=detalle; r.monto=signed; r.fecha=fecha; r.tipo=tp; } });
    }else{
      state.push({id:"m"+Date.now().toString(36)+Math.floor(Math.random()*1000), detalle:detalle, monto:signed, fecha:fecha, tipo:tp});
    }
    closeForm(); render(); persist();
  }
  function delMov(id){
    state = state.filter(function(r){return r.id!==id;});
    closeForm(); render(); persist();
  }

  // ---- exportar / importar (versión local) ----
  function buildCsv(){
    var rows=state.slice().sort(function(a,b){return a.fecha<b.fecha?-1:1;});
    var lines=["Fecha;Detalle;Tipo;Monto"];
    rows.forEach(function(r){
      var d=fmtDate(r.fecha);
      var det='"'+(r.detalle||"").replace(/"/g,'""')+'"';
      lines.push([d,det,tipoOf(r),String(r.monto).replace(".",",")].join(";"));
    });
    var t=totals(state);
    lines.push("");
    lines.push("TOTAL APORTES;;;"+String(t.aporte).replace(".",","));
    lines.push("TOTAL INTERESES;;;"+String(t.interes).replace(".",","));
    lines.push("TOTAL SALIDAS;;;"+String(t.salida).replace(".",","));
    lines.push("SALDO;;;"+String(t.saldo).replace(".",","));
    return "﻿"+lines.join("\r\n");
  }
  function exportCsv(){
    try{
      var blob=new Blob([buildCsv()],{type:"text/csv;charset=utf-8"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      var hoy=new Date().toISOString().slice(0,10);
      a.href=url; a.download="caja_ijes_"+hoy+".csv";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
      setSaver("CSV exportado ✓",false);
    }catch(e){ setSaver("No se pudo exportar",true); }
  }
  // respaldo completo en JSON (recomendado para mover a otra PC)
  function exportJson(){
    try{
      var blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      var hoy=new Date().toISOString().slice(0,10);
      a.href=url; a.download="caja_ijes_respaldo_"+hoy+".json";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
      setSaver("Respaldo guardado ✓",false);
    }catch(e){ setSaver("No se pudo guardar el respaldo",true); }
  }
  function importJson(file){
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var arr=JSON.parse(rd.result);
        if(!Array.isArray(arr)) throw 0;
        // normalizar
        arr=arr.filter(function(r){return r&&typeof r.monto==="number"&&r.fecha;});
        arr.forEach(function(r){ if(!r.id) r.id="m"+Date.now().toString(36)+Math.floor(Math.random()*1e4); if(!r.tipo) r.tipo=(r.monto<0?"salida":"aporte"); });
        state=arr; render(); persist();
        setSaver("Respaldo importado ✓ ("+arr.length+" movimientos)",false);
      }catch(e){ setSaver("Archivo de respaldo inválido",true); }
    };
    rd.readAsText(file);
  }

  // ---- informe ----
  function lastMonthKey(){
    // mes calendario más reciente con movimientos
    var keys = state.map(function(r){return monthKey(r.fecha);});
    if(!keys.length) return null;
    keys.sort();
    return keys[keys.length-1];
  }
  function openReport(){
    var t=totals(state);
    var lmk=lastMonthKey();
    var inMonth = lmk ? state.filter(function(r){return monthKey(r.fecha)===lmk;}) : [];
    var ingresos = inMonth.filter(function(r){return r.monto>0;}).reduce(function(s,r){return s+r.monto;},0);
    var gastos = inMonth.filter(function(r){return r.monto<0;}).reduce(function(s,r){return s+r.monto;},0);
    // abonaron ese mes = aportes (no intereses) positivos
    var abonaron = inMonth.filter(function(r){return tipoOf(r)==="aporte" && r.monto>0;})
                          .sort(function(a,b){return b.monto-a.monto;});
    var mesTxt = lmk ? (function(){var d=new Date(lmk+"-01T00:00");return MESES[d.getMonth()]+" "+d.getFullYear();})() : "—";
    var hoy=new Date();
    var hoyTxt=("0"+hoy.getDate()).slice(-2)+"/"+("0"+(hoy.getMonth()+1)).slice(-2)+"/"+hoy.getFullYear();

    var abList = abonaron.length
      ? '<ul>'+abonaron.map(function(r){
          return '<li><span class="who">'+escapeHtml(r.detalle)+'</span><span class="amt tnum">'+money(r.monto)+'</span></li>';
        }).join('')+'</ul>'
      : '<div class="rep-none">Nadie registró aportes en '+mesTxt+'.</div>';

    var bd=document.createElement("div"); bd.className="backdrop"; bd.id="backdrop";
    bd.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true">'+
        '<h2>Informe de caja</h2>'+
        '<div class="hint">Al '+hoyTxt+' · Último mes con movimientos: '+mesTxt+'</div>'+
        '<div class="rep-block">'+
          '<div class="rl">Total en caja (saldo)</div>'+
          '<div class="rv tnum">'+money(t.saldo)+'</div>'+
        '</div>'+
        '<div class="rep-grid">'+
          '<div class="rep-block ingreso"><div class="rl">Ingresó en '+mesTxt+'</div>'+
            '<div class="rv tnum">'+money(ingresos)+'</div></div>'+
          '<div class="rep-block gasto"><div class="rl">Se gastó en '+mesTxt+'</div>'+
            '<div class="rv tnum">'+money(gastos)+'</div></div>'+
        '</div>'+
        '<div class="rep-block rep-ab">'+
          '<div class="rl">Abonaron en '+mesTxt+' ('+abonaron.length+')</div>'+
          abList+
        '</div>'+
        '<div class="sheet-actions">'+
          '<button class="btn ghost" id="repPdfBtn" type="button">Descargar PDF</button>'+
          '<button class="btn" id="repCloseBtn" type="button">Cerrar</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(bd);
    bd.addEventListener("click",function(e){ if(e.target===bd) closeForm(); });
    el("repCloseBtn").addEventListener("click",closeForm);
    el("repPdfBtn").addEventListener("click",function(){
      reportPdf({saldo:t.saldo, aporte:t.aporte, interes:t.interes, salida:t.salida,
                 mesTxt:mesTxt, hoyTxt:hoyTxt, ingresos:ingresos, gastos:gastos, abonaron:abonaron});
    });
  }

  function reportPdf(d){
    var JS = window.jspdf && window.jspdf.jsPDF;
    if(!JS){ setSaver("No se pudo cargar el generador de PDF",true); return; }
    var doc=new JS({unit:"pt",format:"a4"});
    var W=doc.internal.pageSize.getWidth();
    var M=48, y=56;
    function line(txt,size,style,color,gap){
      doc.setFont("helvetica",style||"normal"); doc.setFontSize(size||11);
      if(color) doc.setTextColor(color[0],color[1],color[2]); else doc.setTextColor(28,36,32);
      doc.text(txt,M,y); y+=(gap||size*1.5);
    }
    function right(txt,size,style,color){
      doc.setFont("helvetica",style||"normal"); doc.setFontSize(size||11);
      if(color) doc.setTextColor(color[0],color[1],color[2]); else doc.setTextColor(28,36,32);
      doc.text(txt,W-M,y,{align:"right"});
    }
    // encabezado
    doc.setFillColor(47,125,79); doc.rect(0,0,W,8,"F");
    line("Caja IJES SUBS",20,"bold",[28,82,52],30);
    line("Informe de caja",13,"bold",null,18);
    line("Al "+d.hoyTxt+"  ·  Último mes con movimientos: "+d.mesTxt,10,"normal",[95,107,99],26);

    // saldo
    doc.setDrawColor(221,227,220); doc.setLineWidth(1);
    doc.line(M,y-6,W-M,y-6); y+=14;
    line("TOTAL EN CAJA (SALDO)",9,"bold",[95,107,99],24);
    line("$"+FMT.format(d.saldo),22,"bold",[28,82,52],30);

    doc.line(M,y-6,W-M,y-6); y+=14;
    // ingreso / gasto del mes
    line("MOVIMIENTO DE "+d.mesTxt.toUpperCase(),9,"bold",[95,107,99],18);
    var yRow=y;
    doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(28,36,32);
    doc.text("Ingresó en el mes",M,y);
    doc.setFont("helvetica","bold"); doc.setTextColor(47,125,79);
    doc.text("$"+FMT.format(d.ingresos),W-M,y,{align:"right"}); y+=20;
    doc.setFont("helvetica","normal"); doc.setTextColor(28,36,32);
    doc.text("Se gastó en el mes",M,y);
    doc.setFont("helvetica","bold"); doc.setTextColor(192,57,43);
    doc.text("$"+FMT.format(d.gastos),W-M,y,{align:"right"}); y+=30;

    doc.setDrawColor(221,227,220); doc.line(M,y-6,W-M,y-6); y+=14;
    // abonaron
    line("ABONARON EN "+d.mesTxt.toUpperCase()+" ("+d.abonaron.length+")",9,"bold",[95,107,99],18);
    if(d.abonaron.length){
      d.abonaron.forEach(function(r){
        if(y>780){ doc.addPage(); y=56; }
        doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(28,36,32);
        doc.text(String(r.detalle).slice(0,54),M,y);
        doc.setFont("helvetica","bold"); doc.setTextColor(47,125,79);
        doc.text("$"+FMT.format(r.monto),W-M,y,{align:"right"});
        y+=19;
        doc.setDrawColor(238,241,236); doc.line(M,y-7,W-M,y-7);
      });
    } else {
      line("Nadie registró aportes en "+d.mesTxt+".",10,"normal",[95,107,99],18);
    }
    // pie
    doc.setFont("helvetica","italic"); doc.setFontSize(8); doc.setTextColor(150,160,152);
    doc.text("Generado el "+d.hoyTxt+" · Caja IJES SUBS",M,820);

    var fname="informe_caja_"+new Date().toISOString().slice(0,10)+".pdf";
    // En artifact: usar capability downloads. En local: <a download>.
    if(window.claude && window.claude.use){
      var blob=doc.output("blob");
      window.claude.use("downloads").then(function(dl){
        if(!dl){ localPdfFallback(doc,fname); return; }
        dl.save({filename:fname, data:blob}).then(function(){ setSaver("PDF descargado ✓",false); })
          .catch(function(err){ if(err&&err.code==="declined"){setSaver("",false);return;} setSaver("No se pudo descargar el PDF",true); });
      }).catch(function(){ localPdfFallback(doc,fname); });
    } else {
      localPdfFallback(doc,fname);
    }
  }
  function localPdfFallback(doc,fname){
    try{ doc.save(fname); setSaver("PDF descargado ✓",false); }
    catch(e){ setSaver("No se pudo generar el PDF",true); }
  }

  // ---- tema ----
  function initTheme(){
    var saved; try{ saved=localStorage.getItem("caja_theme"); }catch(e){}
    if(saved) document.documentElement.setAttribute("data-theme",saved);
    el("themeBtn").addEventListener("click",function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var isDark = cur==="dark" || (!cur && window.matchMedia("(prefers-color-scheme:dark)").matches);
      var next=isDark?"light":"dark";
      document.documentElement.setAttribute("data-theme",next);
      try{ localStorage.setItem("caja_theme",next); }catch(e){}
    });
  }

  // ---- init ----
  el("q").addEventListener("input",render);
  el("fTipo").addEventListener("change",render);
  el("addBtn").addEventListener("click",function(){ openForm(null); });
  el("reportBtn").addEventListener("click",openReport);
  el("exportBtn").addEventListener("click",exportCsv);
  el("backupBtn").addEventListener("click",exportJson);
  el("importInput").addEventListener("change",function(e){ if(e.target.files[0]) importJson(e.target.files[0]); e.target.value=""; });
  initTheme();
  render();                 // muestra enseguida lo local
  cloudLoad(function(){ render(); });  // trae de la nube y re-dibuja

  // al volver a la app (cambiar de pestaña/volver del fondo) refresca desde la nube
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && cloudReady){ cloudLoad(function(){ render(); }); }
  });

  // Service worker: permite que la app funcione sin internet
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
